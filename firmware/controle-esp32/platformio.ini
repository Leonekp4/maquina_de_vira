; Configuração inicial genérica compatível com ESP32 clássico / flash de 4 MB.
; UART real; saídas de atuadores bloqueadas até identificar interfaces e calibração.
[env:controle-uart]
platform = espressif32@6.10.0
board = esp32dev
framework = arduino
monitor_speed = 115200
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -I../../shared/protocol
